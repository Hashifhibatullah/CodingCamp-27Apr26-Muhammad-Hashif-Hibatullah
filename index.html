<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <!-- Path disesuaikan dengan folder rules: css/ -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main class="container">
        <header>
            <h1>Expense Tracker</h1>
            <section class="balance-card">
                <p>TOTAL BALANCE</p>
                <h2>Rp <span id="balance">0</span></h2>
            </section>
        </header>

        <section class="form-container">
            <form id="form">
                <fieldset>
                    <legend>Add Transaction</legend>
                    <label for="name">Item Name</label>
                    <input type="text" id="name" placeholder="E.g. Nasi Daun Jeruk" required>
                    
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Amount" required>
                    
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                    
                    <button type="submit" class="btn-add">Add Transaction</button>
                </fieldset>
            </form>
        </section>

        <section class="dashboard">
            <article class="transaction-section">
                <h3>Transactions History</h3>
                <ul id="list" class="scrollable-list"></ul>
            </article>

            <article class="chart-section">
                <h3>Spending Distribution</h3>
                <canvas id="chart"></canvas>
            </article>
        </section>
    </main>
  <!-- Path disesuaikan dengan folder rules: js/ -->
    <script src="js/script.js\"></script>
</body>
</html>
